# Publishes charts/* to GitHub Container Registry as OCI artifacts:
#   oci://ghcr.io/<owner>/charts/<chart>:<version>
# A chart is pushed only when its Chart.yaml version is not already in the registry.
name: Release charts

on:
  push:
    branches: [main]
    paths: ["charts/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push changed versions
        env:
          OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          for dir in charts/*/; do
            name=$(yq '.name' "$dir/Chart.yaml")
            version=$(yq '.version' "$dir/Chart.yaml")
            if helm pull "$OCI_REPO/$name" --version "$version" -d /tmp >/dev/null 2>&1; then
              echo "skip $name:$version (already published)"
              continue
            fi
            helm package "$dir" -d .cr-release-packages
            helm push ".cr-release-packages/$name-$version.tgz" "$OCI_REPO"
          done
