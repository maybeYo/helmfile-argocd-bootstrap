# helmfile -e example-dev
# A shared non-production cluster. SOPS with an age key (docs/secrets.md).
# Set kubeContext in helmfile.yaml.gotmpl, or rely on the current kubectl context.

gitops:
  repoURL: https://github.com/maybeYo/helmfile-argocd-bootstrap.git
  revision: main

secrets:
  enabled: true   # expects helmfile/secrets/example-dev/argocd.yaml (SOPS-encrypted)
  backend: age

aws:
  enabled: false
  region: ""
  repoServerRoleArn: ""
