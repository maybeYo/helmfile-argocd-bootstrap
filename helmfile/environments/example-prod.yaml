# helmfile -e example-prod
# An EKS cluster. SOPS with AWS KMS, decrypted in-cluster through IRSA (docs/aws-eks.md).

gitops:
  repoURL: https://github.com/maybeYo/helmfile-argocd-bootstrap.git
  revision: main

secrets:
  enabled: true   # expects helmfile/secrets/example-prod/argocd.yaml (SOPS-encrypted)
  backend: kms

aws:
  enabled: true
  region: us-east-1
  # IRSA role granted kms:Decrypt on the SOPS key. Replace the placeholders.
  repoServerRoleArn: arn:aws:iam::<ACCOUNT_ID>:role/<CLUSTER_NAME>-argocd-repo-server
