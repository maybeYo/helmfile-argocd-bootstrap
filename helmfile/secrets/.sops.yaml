# SOPS configuration for helmfile bootstrap secrets (helmfile/secrets/**).
#
# Default backend: age.
#   age-keygen -o key.txt          # prints "Public key: age1..."
#   export SOPS_AGE_KEY_FILE=$PWD/key.txt
# Replace the placeholder below with your public key, then:
#   helm secrets encrypt example-dev/argocd.yaml   (or: sops -e -i <file>)
#
# AWS KMS alternative (docs/aws-eks.md): comment out `age`, uncomment `kms`.
creation_rules:
  - path_regex: .*
    age: age1REPLACE_WITH_YOUR_AGE_PUBLIC_KEY
    # kms: arn:aws:kms:<region>:<account-id>:key/<key-id>
