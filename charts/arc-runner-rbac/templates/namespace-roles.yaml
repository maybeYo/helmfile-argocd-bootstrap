{{- range .Values.namespaceRoles }}
{{- if .createNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .namespace }}
  labels:
    app.kubernetes.io/name: arc-runner-rbac
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-runner-{{ .namespace }}-admin
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: arc-runner-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
{{- range .serviceAccounts }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $.Values.namespace }}
{{- end }}
{{- end }}
